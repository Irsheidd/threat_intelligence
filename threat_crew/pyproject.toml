[project]
name = "threat_crew"
version = "0.2.0"
description = "CrewAI agent definitions (Detector, Analyzer, Reporter) for the threat intelligence pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
run_crew = "threat_crew.main:run"
run_with_trigger = "threat_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
